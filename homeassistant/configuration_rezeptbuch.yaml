# In die configuration.yaml einfügen (oder als Package einbinden) und Home Assistant neu starten.
#
# WICHTIG: Der Hostname "83bccaf2-rezeptbuch" gilt bei Installation aus dem Repository
# https://github.com/dieterfinke/rezeptbuch-addon (so steht er auch auf der Info-Seite des Add-ons).
# Wurde das Add-on stattdessen als lokales Add-on (Ordner /addons/rezeptbuch) installiert,
# lautet er "local-rezeptbuch".

rest_command:
  rezeptbuch:
    url: "http://83bccaf2-rezeptbuch:8099/api/sprache/{{ aktion }}?name={{ name | default('') | urlencode }}"
    method: GET
    timeout: 20

intent_script:
  RezeptStarten:
    action:
      - action: rest_command.rezeptbuch
        data:
          aktion: start
          name: "{{ rezept }}"
        response_variable: antwort
      - stop: ""
        response_variable: antwort
    speech:
      text: >-
        {{ action_response.content.antwort if action_response.content is mapping
           else 'Das Rezeptbuch antwortet gerade nicht.' }}
  RezeptZutaten:
    action:
      - action: rest_command.rezeptbuch
        data:
          aktion: zutaten
          name: "{{ rezept }}"
        response_variable: antwort
      - stop: ""
        response_variable: antwort
    speech:
      text: >-
        {{ action_response.content.antwort if action_response.content is mapping
           else 'Das Rezeptbuch antwortet gerade nicht.' }}
  RezeptWeiter:
    action:
      - action: rest_command.rezeptbuch
        data:
          aktion: weiter
          name: ""
        response_variable: antwort
      - stop: ""
        response_variable: antwort
    speech:
      text: >-
        {{ action_response.content.antwort if action_response.content is mapping
           else 'Das Rezeptbuch antwortet gerade nicht.' }}
  RezeptZurueck:
    action:
      - action: rest_command.rezeptbuch
        data:
          aktion: zurueck
          name: ""
        response_variable: antwort
      - stop: ""
        response_variable: antwort
    speech:
      text: >-
        {{ action_response.content.antwort if action_response.content is mapping
           else 'Das Rezeptbuch antwortet gerade nicht.' }}
  RezeptWiederholen:
    action:
      - action: rest_command.rezeptbuch
        data:
          aktion: wiederholen
          name: ""
        response_variable: antwort
      - stop: ""
        response_variable: antwort
    speech:
      text: >-
        {{ action_response.content.antwort if action_response.content is mapping
           else 'Das Rezeptbuch antwortet gerade nicht.' }}
  RezeptListe:
    action:
      - action: rest_command.rezeptbuch
        data:
          aktion: liste
          name: "{{ kategorie }}"
        response_variable: antwort
      - stop: ""
        response_variable: antwort
    speech:
      text: >-
        {{ action_response.content.antwort if action_response.content is mapping
           else 'Das Rezeptbuch antwortet gerade nicht.' }}
